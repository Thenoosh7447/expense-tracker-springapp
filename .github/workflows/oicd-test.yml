name: Testing the OICD connection

on:
  workflow_dispatch: 
  
permissions:
  id-token: write   # This is required for requesting the JWT
  contents: read    # This is required for actions/checkout

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4
        
      - name: AWS login OIDC
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::779679300431:role/github-aws-oidc
          aws-region: ap-south-1

      - name: Check a service
        run: aws s3api list-objects-v2 --bucket amzn-s3-expense-tracker-application --query 'Contents[].Key' --output text   

