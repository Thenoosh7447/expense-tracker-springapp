name: Build and Upload Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: 
  id-token: write
  contents: read

jobs:
  BuildnPush:
    runs-on: ubuntu-latest

    steps:
      - name: Repository Checkout
        uses: actions/checkout@v4
  
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
            
      - name: Docker Setup Buildx
        uses: docker/setup-buildx-action@v4
  
      - name: Docker Login
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKERHUB_ACTIONS_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACTIONS_PAT }}
  
      - name: Build and Push Image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: thenoosh/exp-track-img:${{ github.sha }}
          
      - name: AWS Login
        uses: aws-actions/configure-aws-credentials@v4.1.0
        with:
          role-to-assume: arn:aws:iam::779679300431:role/github-aws-oidc
          aws-region: ap-south-1

      - name: COPY env Image Name
        run: |
          echo "IMAGE_NAME=thenoosh/exp-track-img:${{ github.sha }}" > .env.container

      - name: S3 upload
        run: aws s3 cp .env.container s3://amzn-s3-expense-tracker-application 

      - name: Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name asg-main \
            --preferences MinHealthyPercentage=50,AutoRollback=true,InstanceWarmup=120
